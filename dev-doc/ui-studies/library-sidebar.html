<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bowerbird · 素材库侧栏示意</title>
<style>
  :root {
    color-scheme: dark;
    --canvas: #141414; --chrome: #181818; --panel: #1e1e1e; --hover: #282828;
    --line: #3d3d3d; --muted: #949494; --secondary: #b9b9b9; --ink: #dcdcdc; --accent: #8faab8;
    --edge: color-mix(in srgb, var(--line) 65%, transparent);
    font: 14px/1.5 Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --canvas: #e7e7e7; --chrome: #efefef; --panel: #f7f7f7; --hover: #e1e1e1;
    --line: #c5c5c5; --muted: #646464; --secondary: #4d4d4d; --ink: #2b2b2b; --accent: #496775;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); }
  button, input, select { font: inherit; }
  button { cursor: pointer; border: 0; border-radius: 0; background: none; color: inherit; }
  button:hover { color: var(--accent); background: var(--hover); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  button[aria-current], button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
  button[aria-disabled="true"] { color: var(--muted); opacity: .55; cursor: default; background: none; }
  button, legend, input, select { min-width: 0; }
  .icon { width: 16px; height: 16px; flex: none; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; padding: 0; flex: none; }
  .icon-btn[aria-pressed="true"]::after { content: ""; position: absolute; width: 3px; height: 3px; background: var(--accent); bottom: 3px; right: 3px; }
  .icon-btn[aria-pressed] { position: relative; }
  .review, .appbar { display: flex; align-items: center; gap: 16px; padding: 0 16px; flex: none; }
  .review { min-height: 58px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .review h1 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .review nav, .theme { display: flex; gap: 2px; }
  .review button { min-height: 32px; padding: 0 10px; color: var(--secondary); white-space: nowrap; font-size: 12px; }
  .review button[aria-pressed="true"] { color: var(--accent); background: var(--hover); box-shadow: inset 0 -2px var(--accent); }
  .theme { margin-left: auto; }
  .appbar { height: 44px; position: relative; background: var(--chrome); border-bottom: 1px solid var(--line); }
  .brand, .app-action, .app-current { display: inline-flex; align-items: center; gap: 8px; padding: 0 6px; min-height: 32px; white-space: nowrap; }
  .brand { font-weight: 600; letter-spacing: .01em; padding: 0; }
  .app-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; color: var(--secondary); }
  .app-current { color: var(--accent); position: relative; }
  .app-current::after { content: ""; width: 3px; height: 3px; background: var(--accent); position: absolute; bottom: 3px; right: 2px; }
  .app-right { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .app-action[aria-expanded="true"] { color: var(--accent); }
  #workspace { position: relative; flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .library { container-type: inline-size; position: relative; min-width: 0; min-height: 0; display: flex; flex: 1; background: var(--canvas); --sidebar-size: min(var(--sidebar-width, 208px), 36cqi); }
  #workspace[data-host="split"] .library + .library { border-left: 4px solid var(--line); }
  #workspace[data-host="split"] .library[data-active] { box-shadow: inset 0 2px var(--accent); }
  .sidebar { width: var(--sidebar-size); flex: none; display: flex; flex-direction: column; position: relative; z-index: 2; background: var(--chrome); border-right: 1px solid var(--line); }
  .library[data-collapsed] .sidebar { width: 44px; }
  .side-head, .catalog-tools { flex: none; display: flex; align-items: center; min-height: 49px; border-bottom: 1px solid var(--edge); }
  .side-head { padding: 0 6px; }
  .side-head .all { flex: 1; min-height: 32px; padding: 0 4px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-head [data-action="tags"] > span { position:absolute; inset:0 0 auto auto; z-index:3; display:none; align-items:center; gap:5px; height:32px; padding:0 7px; white-space:nowrap; background:var(--panel); color:var(--accent); border:1px solid var(--line); pointer-events:none; font-size:12px; }
  .side-head [data-action="tags"]:is(:hover,:focus-visible) > span { display:flex; }
  .side-body { min-height: 0; flex: 1; display: flex; }
  .hierarchy, .tag-scroll { flex: 1; min-width: 0; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .hierarchy { padding: 9px 6px; }
  .nav-group + .nav-group { margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--edge); }
  .nav-row { position: relative; display: flex; align-items: center; min-height: 32px; }
  .nav-row .row-button { position: relative; width: 100%; height: 32px; padding: 0 7px; display: flex; align-items: center; gap: 7px; text-align: left; font-size: 13px; }
  .row-button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-button .icon { width: 14px; height: 14px; }
  .nav-row .row-button[aria-current], .tag-row[aria-current] { background: color-mix(in srgb, var(--accent) 9%, var(--chrome)); }
  .nav-row .row-button[aria-current]::before, .tag-row[aria-current]::before, .side-head .all[aria-current]::before {
    content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; background: var(--accent);
  }
  .side-head .all { position: relative; }
  .side-head .all[aria-current]::before { top: auto; left: 5px; bottom: 1px; width: 11px; height: 2px; }
  .nav-group > .nav-row > .row-button { font-weight: 600; }
  .nav-children { margin-left: 12px; padding-left: 2px; border-left: 1px solid var(--edge); }
  .tree-row[data-depth="1"] { margin-left: 12px; }
  .tree-row[data-depth="2"] { margin-left: 24px; }
  .nav-row .caret { height: 28px; width: 18px; color: var(--secondary); }
  .nav-row .caret .icon { width: 12px; height: 12px; }
  .tree-row .row-button { padding-left: 2px; }
  .nav-row .caret-space { flex: 0 0 18px; }
  .folder-connect { width: 28px; color: var(--secondary); }
  .nav-row.is-drop-target { outline: 1px dashed var(--accent); outline-offset: -1px; }
  .side-footer { border-top: 1px solid var(--edge); flex: none; padding: 6px; }
  .side-footer button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 0 8px; color: var(--secondary); font-size: 12px; text-align: left; }
  .library[data-collapsed] :is(.side-body,.side-footer,.resize-side), .library:not([data-collapsed]) .expand { display: none; }
  .library[data-collapsed] .side-head > :not(.expand) { display: none; }
  .resize-side { position: absolute; right: -4px; top: 49px; bottom: 0; width: 7px; cursor: ew-resize; touch-action: none; z-index: 1; }
  .resize-side:hover, .resize-side:focus-visible { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  .alphabet { flex: 0 0 25px; min-height: 0; overflow: auto; display: flex; flex-direction: column; padding: 4px 1px; scrollbar-width: thin; border-right: 1px solid var(--edge); }
  .alphabet button { flex: 1 0 16px; min-height: 16px; padding: 0; font: 11px/1 monospace; }
  .tag-scroll { padding: 5px 6px; }
  .tag-initial { color: var(--muted); font: 11px/22px monospace; margin: 4px 6px 0; }
  .tag-row { position: relative; width: 100%; height: 30px; padding: 0 8px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .catalog { container-type: inline-size; position: relative; display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
  .catalog-tools { padding: 0 12px; gap: 4px; justify-content: flex-end; background: var(--chrome); }
  .catalog-tools select, .bulk button { color: var(--secondary); border: 0; background: transparent; height: 32px; padding: 0 6px; font-size: 12px; }
  .catalog-tools .icon-btn { color: var(--secondary); }
  .catalog-tools button:is([aria-pressed="true"], :hover) { color: var(--accent); }
  .tool-rule { width: 1px; height: 16px; margin: 0 4px; background: var(--line); }
  .bulk { display: flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 12px; }
  .bulk output { color: var(--accent); }
  .popover { margin: 0; inset: auto; position: fixed; padding: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); box-shadow: 0 4px 16px #0003; }
  .popover label { display: block; margin: 0 0 4px; color: var(--secondary); font-size: 12px; }
  .popover input, dialog input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); background: var(--canvas); color: var(--ink); }
  .swatches { display: flex; flex-wrap: wrap; gap: 5px; }
  .swatches button { min-height: 32px; }
  .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; background: var(--swatch); border: 1px solid var(--line); }
  .gallery { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; padding: 16px; }
  .asset-section + .asset-section { margin-top: 24px; }
  .asset-section h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; padding: 1px 0 7px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .asset-section h2 small { color: var(--muted); font-size: 12px; font-weight: 400; }
  .gallery[data-tags] .asset-section:last-child { min-height: calc(100cqh - 64px); }
  .masonry { display: grid; grid-auto-rows: 4px; column-gap: 12px; grid-template-columns: repeat(var(--columns, 1), minmax(0, 1fr)); align-items: start; }
  .asset { position: relative; margin: 0; min-width: 0; background: var(--panel); box-shadow: 0 0 0 1px var(--edge); }
  .asset img { display: block; width: 100%; aspect-ratio: var(--ratio); object-fit: contain; }
  .asset button { display: block; width: 100%; padding: 0; text-align: left; }
  .asset button:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  .asset-name { display: block; height: 28px; padding: 5px 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--secondary); font-size: 12px; }
  .asset-badge, .duration { position: absolute; display: inline-flex; align-items: center; gap: 4px; top: 7px; left: 7px; padding: 2px 6px; background: #1e1e1e; color: #e4e4e4; font-size: 11px; }
  .asset-badge .icon { width: 12px; height: 12px; }
  .duration { inset: auto 6px 34px auto; font-variant-numeric: tabular-nums; }
  .asset[data-selected] { outline: 2px solid var(--accent); }
  .asset[data-selected]::after { content: "✓"; position: absolute; right: 7px; top: 7px; width: 20px; height: 20px; display: grid; place-items: center; background: var(--accent); color: var(--canvas); pointer-events: none; }
  .doc-card { aspect-ratio: var(--ratio); background: var(--panel); padding: 14px; font-size: 12px; overflow: hidden; }
  .doc-card strong { display: block; margin-bottom: 9px; font-size: 14px; }
  .waveform { aspect-ratio: var(--ratio); display: flex; gap: 3px; align-items: center; justify-content: center; }
  .waveform i { width: 2px; background: var(--accent); height: var(--peak); }
  .empty { color: var(--muted); margin: 20px 0; }
  .canvas-stage { position: absolute; inset: 0; overflow: hidden; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 16px 16px; }
  .canvas-items { position: absolute; top: 18%; left: max(53%, 530px); display: flex; align-items: center; gap: 48px; }
  .canvas-note, .canvas-media { width: 180px; flex: none; background: var(--panel); border: 1px solid var(--line); padding: 12px; position: relative; }
  .canvas-note::after { content: ""; position: absolute; top: 50%; width: 49px; height: 1px; background: var(--accent); left: 100%; }
  .canvas-note p { font-size: 12px; color: var(--secondary); margin-bottom: 0; }
  .canvas-media img { width: 100%; display: block; }
  .canvas-zoom { position: absolute; bottom: 18px; right: 24px; background: var(--panel); padding: 6px 10px; color: var(--secondary); font-size: 12px; }
  #workspace[data-host="canvas"] .library { flex: none; width: min(100%, 510px); border-right: 1px solid var(--line); --sidebar-size: min(var(--sidebar-width, 208px), 33cqi); }
  #workspace[data-host="text"] .library { flex: none; width: min(100%, 600px); border-right: 1px solid var(--line); --sidebar-size: min(var(--sidebar-width, 208px), 35cqi); }
  .editor { flex: 1; min-width: 0; overflow: auto; padding: 36px clamp(20px, 6vw, 88px); background: var(--panel); }
  .editor h2 { font-size: 22px; margin: 0 0 24px; font-weight: 600; }
  .editor [contenteditable] { color: var(--secondary); min-height: 130px; max-width: 580px; line-height: 1.8; }
  dialog { max-width: min(420px, 90vw); background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 18px; }
  dialog::backdrop { background: #0007; }
  dialog h2 { margin: 0 0 12px; font-size: 16px; }
  dialog p { margin: 0 0 14px; }
  dialog img { display: block; max-width: 100%; max-height: 55vh; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin: 12px 0 0; }
  .dialog-actions button { min-height: 32px; padding: 0 12px; }
  .context-menu { position: fixed; margin: 0; inset: auto; z-index: 10; background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 4px; }
  .context-menu button { display: block; width: 100%; min-height: 32px; text-align: left; padding: 0 11px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @container (max-width: 355px) {
    .catalog-tools { padding-inline: 5px; gap: 1px; }
    .catalog-tools .icon-btn { width: 28px; }
    .tool-rule { display: none; }
    .gallery { padding: 10px; }
  }
  @container (max-width: 450px) {
    .side-head .icon-btn:not(.expand) { width: 26px; }
    .side-head .all { font-size: 13px; }
  }
  @media (max-width: 840px) {
    #workspace[data-host="text"] .library { width: min(100%, 510px); }
    .editor { padding: 20px; }
  }
  @media (max-width: 630px) {
    .review { padding: 7px 8px; display: grid; grid-template-columns: 1fr auto; gap: 3px 4px; }
    .review nav { grid-row: 2; grid-column: 1 / -1; flex-wrap: wrap; }
    .review .theme { grid-row: 1; grid-column: 2; }
    .appbar { padding-inline: 8px; gap: 8px; }
    .app-center { display: none; }
    #workspace[data-host="text"] .editor { display: none; }
    #workspace[data-host="split"] { display: grid; grid-template-rows: 1fr 1fr; }
    #workspace[data-host="split"] .library + .library { border-left: 0; border-top: 3px solid var(--line); }
  }
</style>
</head>
<body>
  <header class="review">
    <h1>素材库侧栏示意</h1>
    <nav aria-label="预览场景">
      <button type="button" data-host-button="home" aria-pressed="true">首页宽屏</button>
      <button type="button" data-host-button="split" aria-pressed="false">首页多分栏</button>
      <button type="button" data-host-button="canvas" aria-pressed="false">画板窄抽屉</button>
      <button type="button" data-host-button="text" aria-pressed="false">文本工作区</button>
    </nav>
    <div class="theme" role="group" aria-label="主题">
      <button type="button" data-theme-button="dark" aria-pressed="true">深色</button>
      <button type="button" data-theme-button="light" aria-pressed="false">浅色</button>
    </div>
  </header>
  <header class="appbar" id="appbar"></header>
  <main id="workspace"></main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="context-menu" class="context-menu" popover></div>
  <div id="announcement" class="visually-hidden" aria-live="polite"></div>

<script>
  const iconPaths = {
    library: '<rect x="3" y="4" width="18" height="16"/><path d="M9 4v16M5.7 8.5h.1m-.1 3h.1m-.1 3h.1"/>',
    hierarchy: '<path d="M5 5v12h5M5 10h5"/><rect x="10" y="7" width="10" height="5"/><rect x="10" y="15" width="10" height="5"/>',
    tag: '<path d="M3 4h8l9 9-7 7-9-9z"/><circle cx="8" cy="8" r="1"/>',
    project: '<rect x="4" y="4" width="16" height="16"/><path d="M4 9h16M9 9v11"/>',
    folder: '<path d="M3 6h7l2 2h9v11H3z"/>',
    down: '<path d="m6 9 6 6 6-6"/>', right: '<path d="m9 6 6 6-6 6"/>',
    closeSide: '<rect x="3" y="4" width="18" height="16"/><path d="M9 4v16m8-11-3 3 3 3"/>',
    openSide: '<rect x="3" y="4" width="18" height="16"/><path d="M9 4v16m5-11 3 3-3 3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    sparkle: '<path d="M12 2c0 6-4 10-10 10 6 0 10 4 10 10 0-6 4-10 10-10-6 0-10-4-10-10z"/>',
    color: '<path d="M12 3C8 8 5 11 5 15a7 7 0 0 0 14 0c0-4-3-7-7-12zM9 15a3 3 0 0 0 3 3"/>',
    search: '<circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/>',
    refresh: '<path d="M20 7v5h-5M4 17v-5h5m10-1a7 7 0 0 0-12-4m-2 6a7 7 0 0 0 12 4"/>',
    select: '<rect x="4" y="4" width="16" height="16" stroke-dasharray="2 2"/><path d="m8 12 3 3 5-6"/>',
    clone: '<rect x="8" y="8" width="12" height="12"/><path d="M16 4H4v12"/>',
    video: '<path d="m8 5 11 7-11 7z"/>', text: '<path d="M5 4h10l4 4v12H5zM9 10h6m-6 4h6m-6 3h6"/>',
    brand: '<path d="M4 18 9 5l3 7 4-4 4 10zM4 18h16"/>',
  };
  const icon = name => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]}</svg>`;
  const action = (name, label, command, attrs = "", classes = "") =>
    `<button type="button" class="icon-btn ${classes}" aria-label="${label}" ${command === "tags" ? "" : `title="${label}"`} data-action="${command}" ${attrs}>${icon(name)}

    if (button?.dataset.themeButton) setTheme(button.dataset.themeButton);
  });
  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    save("theme", theme);
    document.querySelectorAll("[data-theme-button]").forEach(button => button.setAttribute("aria-pressed", button.dataset.themeButton === theme));
  }
  document.addEventListener("keydown", event => {
    const target = event.target;
    if (event.defaultPrevented || event.isComposing || event.keyCode === 229 ||
        target.closest?.("input, textarea, select, [contenteditable]") ||
        document.querySelector("dialog[open], :popover-open")) return;
    if (event.key === "Tab" && host === "canvas" && !event.shiftKey && !event.altKey && !event.ctrlKey && !event.metaKey &&
        (target === document.body || target === workspace || target.closest?.("#canvas-toggle, .canvas-stage"))) {
      event.preventDefault();
      toggleCanvas();
      return;
    }
    if (host === "canvas" && !canvasOpen) return;
    const key = event.key.toLowerCase();
    if (key === "a" && (event.ctrlKey || event.metaKey) && !event.shiftKey && !event.altKey && target.closest?.(".library")) {
      event.preventDefault(); activePane.selectAll();
    }
    if (event.ctrlKey || event.metaKey || event.altKey || event.shiftKey || !["q", "e"].includes(key)) return;
    event.preventDefault();
    const focusWasInNavigation = target.closest?.(".sidebar");
    activePane.setMode(key === "q" ? "hierarchy" : "tags");
    if (focusWasInNavigation) activePane.root.querySelector(activePane.root.hasAttribute("data-collapsed") ? ".expand" : `[data-action=${key === "q" ? "hierarchy" : "tags"}]`).focus();
  });
  setTheme(load("theme", "dark"));
  render("home");
</script>
</body>
</html>
