# Supabase local development configuration.
# Project-specific secrets belong in apps/cloud/.env.local, never in this file.
project_id = "bowerbird-cloud"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["bowerbird://auth/callback", "http://127.0.0.1:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# Payment providers cannot send a Supabase access token. The function validates
# the provider signature itself before applying any order state transition.
[functions.payment-webhook]
verify_jwt = false
