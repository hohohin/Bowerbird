services:
  generation-worker:
    build:
      context: .
      dockerfile: Dockerfile.generation
    image: bowerbird/generation-worker:local
    restart: unless-stopped
    init: true
    env_file:
      - .env.generation
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    cpus: 1.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
