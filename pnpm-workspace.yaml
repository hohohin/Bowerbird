packages:
  - "apps/*"
  - "packages/*"
  - "website"

# 允许 esbuild 跑 postinstall（下载平台二进制）；其余仍按 pnpm 默认拦截
allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.136'
  - '@ai-sdk/mcp@2.0.91'
  - '@ai-sdk/provider-utils@5.0.75'
  - '@ai-sdk/provider@4.0.36'
  - '@ai-sdk/react@4.0.167'
  - '@platejs/docx-io@53.5.5'
  - ai@7.0.163
  - html2canvas-pro@2.6.3
