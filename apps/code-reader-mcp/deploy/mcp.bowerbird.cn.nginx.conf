limit_req_zone $binary_remote_addr zone=bowerbird_mcp:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=bowerbird_mcp_oauth:1m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.bowerbird.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/bowerbird-mcp/acme;
    }
    location / { return 301 https://mcp.bowerbird.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.bowerbird.cn;
    ssl_certificate /etc/letsencrypt/live/mcp.bowerbird.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.bowerbird.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log /dev/null;
    client_max_body_size 64k;
    client_body_timeout 15s;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_req zone=bowerbird_mcp burst=20 nodelay;
        include /etc/nginx/snippets/bowerbird-mcp-proxy.conf;
    }
    location ^~ /oauth/ {
        limit_req zone=bowerbird_mcp_oauth burst=10 nodelay;
        include /etc/nginx/snippets/bowerbird-mcp-proxy.conf;
    }
}
