<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowerbird · 音频</title>
    <link rel="stylesheet" href="/src/components/LibraryTactical.css">
    <link rel="stylesheet" href="/src/components/IndustrialTheme.css">
    <link rel="stylesheet" href="./preview.css">
  </head>
  <body class="library-tactical">
    <header class="audio-topbar">
      <span class="library-name"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6v6H4zm10 0h6v6h-6zM4 15h6v6H4zm10 0h6v6h-6z"/></svg>素材库</span>
      <button class="theme-toggle" type="button" aria-label="切换为浅色" title="切换为浅色"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg></button>
    </header>
    <main class="audio-scroll" aria-label="音频素材">
      <div class="audio-heading"><h1>音频</h1><span class="audio-count"></span></div>
      <div class="audio-grid" role="list" aria-label="音频文件"></div>
      <p class="load-error" role="status" hidden></p>
    </main>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
