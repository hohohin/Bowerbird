services:
  generation-worker:
    build:
      context: .
      dockerfile: Dockerfile.unified-harness-candidate
      additional_contexts:
        dsh-profile: ${BOWERBIRD_DSH_BUILD_CONTEXT:-../../spikes/unified-agent-harness-u1/profiles/bowerbird-u1}
    image: bowerbird/generation-worker:local
    restart: unless-stopped
    init: true
    env_file:
      - .env.generation
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /workspaces:size=256m,mode=0700,uid=1000,gid=1000
      - /dsh-runtime:size=32m,mode=0700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - bowerbird-internal
    mem_limit: 1536m
    cpus: 1.75
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  bowerbird-internal:
    name: bowerbird-internal
    external: true
