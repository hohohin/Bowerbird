[package]
name = "library-audio-preview"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "=0.5.5", features = ["all", "opt-simd"] }
tempfile = "3"

[dev-dependencies]
filetime = "0.2"

[profile.release]
lto = "thin"
