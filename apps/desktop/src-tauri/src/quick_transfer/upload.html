<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>发送素材 · Bowerbird</title>
<style>
:root{color-scheme:dark;--canvas:#141414;--panel:#1e1e1e;--line:#3d3d3d;--muted:#949494;--secondary:#b9b9b9;--ink:#dcdcdc;--accent:#8faab8;--danger:#e79c98;font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas);font-size:14px;line-height:1.5}
@media(prefers-color-scheme:light){:root{color-scheme:light;--canvas:#e7e7e7;--panel:#f7f7f7;--line:#c5c5c5;--muted:#646464;--secondary:#4d4d4d;--ink:#2b2b2b;--accent:#496775;--danger:#a83932}}
*{box-sizing:border-box}body{margin:0;padding:24px 16px;min-height:100vh}button,input{font:inherit;color:inherit}button{background:transparent;border:0;border-radius:0;min-height:44px;cursor:pointer;transition:color 160ms ease}button:hover,button:focus-visible{color:var(--accent)}button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default;color:var(--muted)}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter;flex-shrink:0}h1,p{margin:0}[hidden]{display:none!important}.phone{max-width:420px;margin:auto;min-height:calc(100vh - 48px);min-height:calc(100svh - 48px);padding:26px 24px max(24px,env(safe-area-inset-bottom));background:var(--panel);display:flex;flex-direction:column;position:relative;box-shadow:0 4px 6px -3px #0003,0 20px 32px -11px #0003}.phone:before{content:"";position:absolute;top:0;left:24px;width:28px;height:1px;background:var(--secondary)}.phone-brand{font-size:13px;letter-spacing:.035em;color:var(--secondary);margin-bottom:38px}h1{font-size:27px;font-weight:500;letter-spacing:.02em;margin-bottom:10px}.receiver{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:28px}.receiver svg{width:16px;height:16px}.pick-area{width:100%;min-height:116px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--accent);font-size:15px}.pick-area svg{width:24px;height:24px}.queue{list-style:none;padding:0;margin:14px 0 0}.file{display:grid;grid-template-columns:29px minmax(0,1fr) auto;gap:10px;padding:13px 0;align-items:center}.file+.file{border-top:1px solid var(--line)}.file-icon{width:29px;height:38px;display:grid;place-items:center;border-left:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--secondary)}.file-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-meta{font-size:12px;color:var(--muted);margin-top:3px}.file-state{font-size:12px;text-align:right;color:var(--muted);min-width:40px}.file-state.done{color:var(--accent)}.file-state.error{color:var(--danger)}.progress{height:2px;background:var(--line);margin-top:9px;overflow:hidden}.progress i{display:block;height:100%;transform-origin:left;background:var(--accent)}.mobile-footer{margin-top:auto;padding-top:28px}.send-button{width:100%;height:48px;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);font-size:15px;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:0 12px;color:var(--accent);font-weight:600;position:relative}.send-button:after{content:"";position:absolute;width:3px;height:3px;background:currentColor;right:5px;bottom:6px}.send-button:disabled:after{display:none}.mobile-note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.8}.mobile-notice{font-size:13px;margin-top:18px;line-height:1.7;color:var(--muted);overflow-wrap:anywhere}.mobile-notice.error{color:var(--danger)}.secondary-actions{display:flex;justify-content:flex-end;gap:8px}.secondary-actions button{font-size:13px;padding:0 4px;color:var(--accent)}
@media(max-width:360px){body{padding:16px 12px}.phone{padding:24px 20px;min-height:calc(100svh - 32px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="upload-icon" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></symbol>
<symbol id="file-icon" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5Zm9 0v5h5M8 13h8M8 17h6"/></symbol>
<symbol id="monitor-icon" viewBox="0 0 24 24"><path d="M3 4h18v13H3Zm9 13v4m-5 0h10"/></symbol>
<symbol id="arrow-icon" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
</defs></svg>
<main class="phone">
  <div class="phone-brand">Bowerbird</div>
  <h1>发送素材</h1>
  <p class="receiver"><svg aria-hidden="true"><use href="#monitor-icon"/></svg><span id="mobile-receiver">正在连接电脑</span></p>
  <input id="file-input" type="file" multiple hidden>
  <button class="pick-area" id="pick" disabled><svg aria-hidden="true"><use href="#upload-icon"/></svg><span>选择照片或文件</span></button>
  <ul class="queue" id="mobile-queue" aria-label="发送队列"></ul>
  <p class="mobile-notice" id="mobile-notice" role="status" aria-live="polite"></p>
  <div class="secondary-actions"><button id="reconnect" hidden>重新连接</button><button id="cancel" hidden>停止发送</button></div>
  <div class="mobile-footer">
    <button class="send-button" id="send" disabled><span id="send-label">选择文件后发送</span><svg aria-hidden="true"><use href="#arrow-icon"/></svg></button>
    <p class="mobile-note">传输时请保持页面打开。<br>仅在可信局域网使用 · HTTP 未加密</p>
  </div>
</main>
<template id="file-template"><li class="file"><div class="file-icon"><svg aria-hidden="true"><use href="#file-icon"/></svg></div><div class="file-info"><p class="file-name"></p><p class="file-meta"></p><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div></div><span class="file-state"></span></li></template>
<script>
'use strict';
const byId = id => document.getElementById(id);
const pin = new URLSearchParams(location.search).get('pin') || '';
const api = '/api/localsend/v2/';
const state = { files: [], connection: 'checking', busy: false, cancelled: false, batch: null, request: null, cancelPromise: null, probing: null };
const messages = {
  expired: '连接已失效，请在电脑开启快传后重新扫码。',
  offline: '连接已中断，请确认电脑接收已开启，并连接同一 Wi-Fi。',
  unknown: '连接已中断，未确认收到的文件可能已传到电脑。请先在电脑核对，再重新发送。',
  rejected: '电脑未接受这批文件，请检查文件格式、大小或接收目录后重新选择。',
  receipt: '电脑未能确认收件，请查看电脑提示。若已收到，请勿重复发送。'
};

function notice(text, error = false) {
  byId('mobile-notice').textContent = text;
  byId('mobile-notice').classList.toggle('error', error);
}

function pendingFiles() { return state.files.filter(item => item.status !== 'done'); }

function sizeText(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1048576) return `${Math.ceil(bytes / 1024)} KB`;
  return `${(bytes / 1048576).toFixed(1)} MB`;
}

function createItem(file, index) {
  const row = byId('file-template').content.firstElementChild.cloneNode(true);
  row.querySelector('.file-name').textContent = file.name;
  row.querySelector('.file-name').title = file.name;
  row.querySelector('.file-meta').textContent = sizeText(file.size);
  row.querySelector('.progress').setAttribute('aria-label', `${file.name} 发送进度`);
  return { file, id: String(index), status: 'queued', progress: 0, row };
}

function renderItem(item) {
  const labels = { queued: '待发送', confirming: '确认中', done: '已发送', failed: '未确认', cancelled: '已停止' };
  const label = item.row.querySelector('.file-state');
  label.textContent = item.status === 'sending' ? `${item.progress}%` : labels[item.status];
  label.className = 'file-state';
  label.classList.toggle('done', item.status === 'done');
  label.classList.toggle('error', item.status === 'failed');
  const progress = item.row.querySelector('.progress');
  progress.hidden = !['sending', 'confirming'].includes(item.status);
  progress.setAttribute('aria-valuenow', String(item.progress));
  progress.firstElementChild.style.transform = `scaleX(${item.progress / 100})`;
}

function sendLabel(pending) {
  if (state.cancelled && state.busy) return '正在停止';
  if (state.busy) return state.batch ? '正在发送' : '正在准备';
  if (!state.files.length) return '选择文件后发送';
  if (!pending.length) return '全部已发送';
  const retry = pending.some(item => item.status !== 'queued');
  return `${retry ? '重新发送' : '发送'} ${pending.length} 个文件`;
}

function render() {
  const pending = pendingFiles();
  const connected = state.connection === 'ready';
  state.files.forEach(renderItem);
  byId('pick').disabled = state.busy || !connected;
  byId('send').disabled = state.busy || !connected || !pending.length;
  byId('send-label').textContent = sendLabel(pending);
  byId('cancel').hidden = !state.busy || !state.batch;
  byId('cancel').disabled = state.cancelled;
  byId('reconnect').hidden = state.connection !== 'offline' || state.busy;
  byId('mobile-receiver').textContent = { checking: '正在连接电脑', ready: '电脑接收已开启', offline: '无法连接电脑', expired: '连接已失效' }[state.connection];
}

function chooseFiles() {
  const files = Array.from(byId('file-input').files);
  byId('file-input').value = '';
  if (state.busy || !files.length) return;
  state.files = files.map(createItem);
  byId('mobile-queue').replaceChildren(...state.files.map(item => item.row));
  notice('');
  render();
}

function protocolUrl(route, query) { return `${api}${route}?${new URLSearchParams(query)}`; }

function responseError(status) {
  const texts = { 0: messages.unknown, 400: '文件名、格式或大小不支持，请重新选择。', 401: messages.expired, 403: messages.rejected, 204: messages.rejected, 409: '电脑正在接收另一批文件，请稍后重试。', 429: '尝试次数过多，请在电脑重新开启快传后扫码。' };
  return Object.assign(new Error(texts[status] || messages.receipt), { status });
}

function request(url, body, progress, timeout = 0) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    state.request = xhr;
    xhr.open('POST', url);
    xhr.timeout = timeout;
    if (typeof body === 'string') xhr.setRequestHeader('Content-Type', 'application/json');
    if (progress) xhr.upload.onprogress = progress;
    xhr.onload = () => xhr.status === 200 ? resolve(xhr.responseText) : reject(responseError(xhr.status));
    xhr.onerror = () => reject(responseError(0));
    xhr.ontimeout = () => reject(responseError(0));
    xhr.onabort = () => reject(responseError(0));
    xhr.send(body);
  });
}

function manifest(items) {
  const files = Object.fromEntries(items.map(item => [item.id, { id: item.id, fileName: item.file.name, size: item.file.size, fileType: item.file.type || 'application/octet-stream' }]));
  return { info: { alias: 'Bowerbird 浏览器', version: '2.1', deviceType: 'web', fingerprint: `web-${Date.now()}-${Math.random().toString(16).slice(2)}`, port: 0, protocol: 'http', download: false }, files };
}

function parseTicket(text) {
  let ticket;
  try { ticket = JSON.parse(text); } catch { throw responseError(500); }
  if (typeof ticket?.sessionId !== 'string' || !ticket.files || typeof ticket.files !== 'object') throw responseError(500);
  return ticket;
}

function updateProgress(item, event) {
  if (!event.lengthComputable || state.cancelled) return;
  item.progress = Math.min(100, Math.round(event.loaded / event.total * 100));
  item.status = event.loaded === event.total ? 'confirming' : 'sending';
  renderItem(item);
}

async function uploadItem(item, ticket) {
  const token = ticket.files[item.id];
  if (typeof token !== 'string') throw responseError(403);
  item.status = 'sending';
  render();
  const query = { sessionId: ticket.sessionId, fileId: item.id, token };
  await request(protocolUrl('upload', query), item.file, event => updateProgress(item, event));
  item.status = 'done';
  item.progress = 100;
  renderItem(item);
}

async function cancelBatch(sessionId) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000);
  try {
    const response = await fetch(protocolUrl('cancel', { sessionId, pin }), { method: 'POST', signal: controller.signal, cache: 'no-store' });
    return response.ok;
  } catch { return false; } finally { clearTimeout(timer); }
}

async function stopSending() {
  if (!state.batch || state.cancelled) return;
  state.cancelled = true;
  state.cancelPromise = cancelBatch(state.batch.sessionId);
  state.request?.abort();
  render();
}

function markUnconfirmed(status) {
  for (const item of pendingFiles()) item.status = status;
}

async function handleFailure(error) {
  if (state.cancelled) {
    const cancelled = await state.cancelPromise;
    markUnconfirmed('cancelled');
    notice(cancelled ? '已停止发送。已确认的文件会保留；未确认的文件请先在电脑核对。' : messages.unknown, !cancelled);
    return;
  }
  markUnconfirmed('failed');
  if ([401, 429].includes(error.status)) state.connection = 'expired';
  if (error.status === 0) state.connection = 'offline';
  notice(error.message, true);
  if (state.batch) await cancelBatch(state.batch.sessionId);
}

async function sendFiles() {
  const items = pendingFiles();
  if (state.busy || state.connection !== 'ready' || !items.length) return;
  state.busy = true;
  state.cancelled = false;
  items.forEach(item => { item.status = 'queued'; item.progress = 0; });
  notice('');
  render();
  try {
    state.batch = parseTicket(await request(protocolUrl('prepare-upload', { pin }), JSON.stringify(manifest(items)), null, 15000));
    for (const item of items) {
      if (state.cancelled) throw responseError(0);
      await uploadItem(item, state.batch);
    }
    notice('已传到电脑，可以继续选择文件。');
  } catch (error) { await handleFailure(error); }
  finally {
    state.busy = false;
    state.batch = null;
    state.request = null;
    state.cancelPromise = null;
    render();
  }
}

async function probeConnection() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000);
  try {
    const response = await fetch(`/?${new URLSearchParams({ pin })}`, { signal: controller.signal, cache: 'no-store' });
    if ([401, 403, 429].includes(response.status)) {
      state.connection = 'expired';
      notice(messages.expired, true);
    } else if (response.ok) {
      if (state.connection === 'offline') {
        const unconfirmed = state.files.some(item => item.status === 'failed');
        notice(unconfirmed ? '连接已恢复。未确认收到的文件请先在电脑核对，再重新发送。' : '');
      }
      state.connection = 'ready';
    } else { throw responseError(0); }
  } catch {
    state.connection = 'offline';
    notice(messages.offline, true);
  } finally { clearTimeout(timer); render(); }
}

function checkConnection() {
  if (state.busy || state.connection === 'expired' || state.probing) return state.probing;
  state.probing = probeConnection().finally(() => { state.probing = null; });
  return state.probing;
}

function lostConnection() {
  if (state.connection === 'expired') return;
  state.connection = 'offline';
  if (state.busy) state.request?.abort();
  notice(state.busy ? messages.unknown : messages.offline, true);
  render();
}

byId('pick').onclick = () => byId('file-input').click();
byId('file-input').onchange = chooseFiles;
byId('send').onclick = sendFiles;
byId('cancel').onclick = stopSending;
byId('reconnect').onclick = checkConnection;
window.addEventListener('offline', lostConnection);
window.addEventListener('online', checkConnection);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkConnection(); });
window.addEventListener('pagehide', () => {
  if (state.batch) fetch(protocolUrl('cancel', { sessionId: state.batch.sessionId, pin }), { method: 'POST', keepalive: true }).catch(() => {});
});
setInterval(() => { if (!document.hidden) checkConnection(); }, 10000);
if (/^[A-Za-z0-9_-]{32,128}$/.test(pin)) checkConnection();
else { state.connection = 'expired'; notice(messages.expired, true); render(); }
</script>
</body>
</html>
