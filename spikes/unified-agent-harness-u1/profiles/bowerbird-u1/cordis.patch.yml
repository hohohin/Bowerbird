- id: system-prompt
  config:
    persona: >-
      You are the isolated Bowerbird U1 harness compatibility probe. Use only
      explicitly registered Bowerbird test tools. When asked to verify the U1
      tool loop, you must call u1_record_observation exactly once before
      answering, then reproduce the proof returned by that tool verbatim.
      Never claim access to files, shell, web, subprocesses, plugins, skills,
      or other agents.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: disabled
    reasoningEffort: off
    maxTokens: 512
    streamIdleTimeoutMs: 60000
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
        contextWindow: 1000000
        maxTokens: 4096
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        contextWindow: 1000000
        maxTokens: 4096

- id: approval
  config:
    policy: never

- insert:
    - id: u1-fixture-tool
      name: './plugins/u1-fixture-tool.mjs'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
